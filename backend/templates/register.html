<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un apprenti - Banc KLX</title>
    <!-- Import de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Le bon lien WebAuthn qui ne plantera pas -->
    <script src="https://cdn.jsdelivr.net/npm/@github/webauthn-json/dist/browser-global/webauthn-json.browser-global.js"></script>
    <style>
        body { 
            background-color: #f4f7f6; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .register-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 450px; 
        }
        .brand-icon { font-size: 3rem; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div class="register-card text-center">
        <div class="brand-icon">🎓</div>
        <h3 class="mb-2">Nouvel Apprenti</h3>
        <p class="text-muted mb-4">Générez une clé d'accès sécurisée (Passkey) pour autoriser un nouvel utilisateur.</p>

        <div class="form-floating mb-4">
            <input type="text" class="form-control" id="usernameInput" placeholder="Nom d'apprenti">
            <label for="usernameInput">Nom d'apprenti</label>
        </div>

        <button id="registerBtn" class="btn btn-success w-100 py-2 fs-5 rounded-pill shadow-sm">
            🔐 Enregistrer la clé d'accès
        </button>

        <div id="alertBox" class="alert mt-3 d-none" role="alert"></div>

        <div class="mt-4">
            <a href="/" class="text-decoration-none text-muted small">← Retour à l'accueil</a>
        </div>
    </div>

    <script>
        // Insère ici ta logique JavaScript d'enregistrement (similaire à celle de ton login.html)
        // document.getElementById('registerBtn').addEventListener('click', async function() { ... });
    </script>
</body>
</html>
