<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel formateur - Banc KLX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@github/webauthn-json/dist/browser-global/webauthn-json.browser-global.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #eef5f2 0%, #f7f9fb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            width: min(100%, 440px);
            padding: 2.2rem;
        }
        .brand-icon {
            font-size: 3.2rem;
            margin-bottom: 1rem;
        }
        .btn-primary {
            border-radius: 999px;
            padding: 0.85rem 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <div class="brand-icon">🛡️</div>
        <h3 class="mb-2">Espace Formateur</h3>
        <p class="text-muted mb-4">Connectez-vous avec votre clé d’accès pour gérer les apprenants.</p>

        <div class="form-floating mb-3 text-start">
            <input type="text" class="form-control" id="usernameInput" placeholder="Nom du formateur">
            <label for="usernameInput">Nom du formateur</label>
        </div>

        <button id="loginBtn" class="btn btn-primary w-100 mb-3">
            🔓 Accéder au panel
        </button>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <div class="mt-3">
            <a href="/" class="text-decoration-none text-muted small">← Retour à l'accueil</a>
        </div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', async function() {
            const username = document.getElementById('usernameInput').value.trim();
            const alertBox = document.getElementById('alertBox');

            if (!username) {
                alertBox.className = 'alert alert-warning mt-3';
                alertBox.textContent = 'Veuillez entrer votre nom.';
                alertBox.classList.remove('d-none');
                return;
            }

            try {
                const optionsRes = await fetch('/api/webauthn/login/options', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: username })
                });

                const options = await optionsRes.json();
                if (options.status === 'error') throw new Error(options.message);

                const credential = await webauthnJSON.get({ publicKey: options });

                const verifyRes = await fetch('/api/webauthn/login/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ credential: credential, username: username })
                });

                const result = await verifyRes.json();
                if (result.status === 'ok') {
                    alertBox.className = 'alert alert-success mt-3';
                    alertBox.textContent = 'Connexion réussie. Redirection...';
                    alertBox.classList.remove('d-none');
                    setTimeout(() => window.location.href = '/admin/creer-apprenti', 800);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alertBox.className = 'alert alert-danger mt-3';
                alertBox.textContent = 'Erreur : ' + error.message;
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
