<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Banc KLX</title>
    <!-- Import de Bootstrap 5 pour un design moderne -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Import de la librairie WebAuthn -->
    <script src="https://unpkg.com/@github/webauthn-json/dist/browser-global/webauthn-json.browser-global.min.js"></script>
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 2rem; background: white; max-width: 400px; width: 100%; }
        .brand-icon { font-size: 3rem; color: #0d6efd; margin-bottom: 1rem; }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="brand-icon">⚙️</div>
        <h3 class="mb-4">Documentation KLX</h3>
        <p class="text-muted mb-4">Authentification sécurisée (Passkey)</p>
        
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="usernameInput" placeholder="Nom d'apprenti">
            <label for="usernameInput">Votre nom d'apprenti</label>
        </div>
        
        <button id="loginBtn" class="btn btn-primary w-100 py-2 fs-5 rounded-pill">
            🔓 Se connecter
        </button>

        <div id="alertBox" class="alert mt-3 d-none" role="alert"></div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', async function() {
            const username = document.getElementById('usernameInput').value;
            const alertBox = document.getElementById('alertBox');
            
            if (!username) {
                alertBox.className = "alert alert-warning mt-3";
                alertBox.textContent = "Veuillez entrer votre nom.";
                return;
            }

            try {
                // Étape 1 : Demander le challenge au serveur
                const optionsRes = await fetch('/api/webauthn/login/options', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: username})
                });
                
                const options = await optionsRes.json();
                if (options.status === 'error') throw new Error(options.message);

                // Étape 2 : Demander l'empreinte/FaceID à l'utilisateur
                const credential = await webauthnJSON.get({ publicKey: options });

                // Étape 3 : Envoyer la preuve au serveur
                const verifyRes = await fetch('/api/webauthn/login/verify', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({credential: credential, username: username})
                });

                const result = await verifyRes.json();
                if (result.status === 'ok') {
                    alertBox.className = "alert alert-success mt-3";
                    alertBox.textContent = "Connexion réussie ! Redirection...";
                    setTimeout(() => window.location.href = '/docs', 1500);
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                alertBox.className = "alert alert-danger mt-3";
                alertBox.textContent = "Erreur : " + error.message;
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
