version: '3.8'

services:
  # 1. Conteneur Base de Données (MySQL)
  db:
    image: mysql:8.0
    container_name: klx_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_securise
      MYSQL_DATABASE: klx_doc_db
      MYSQL_USER: klx_user
      MYSQL_PASSWORD: klx_password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - klx_network

  # 2. Conteneur Application Web (Backend / IHM)
  web:
    build: ./backend
    container_name: klx_web
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=klx_user
      - DB_PASSWORD=klx_password
      - DB_NAME=klx_doc_db
    depends_on:
      - db
    networks:
      - klx_network

  # 3. Conteneur Reverse Proxy (Nginx pour le HTTPS)
  proxy:
    image: nginx:alpine
    container_name: klx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    networks:
      - klx_network

# Déclaration des volumes persistants et du réseau privé
volumes:
  db_data:

networks:
  klx_network:
    driver: bridge

